# Supabase CLI configuration for ecke-crm.
# Links supabase/migrations + supabase/functions to `supabase` CLI commands
# (db reset / db push / functions serve / functions deploy / gen types).
# The old Flutter repo had no config.toml — it was never a CLI-linked project.
#
# The production backend is the SELF-HOSTED stack in infrastructure/supabase/
# (Hetzner + Coolify). This file is for local development and for generating
# TypeScript types; `supabase db push` targets whichever DB `--db-url` points at.

project_id = "ecke-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public", "vault"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Matches infrastructure/supabase/docker-compose.yml -> supabase/postgres:15.x.
# If the self-hosted image is bumped to 17, bump this too and re-test db reset.
major_version = 15

[db.pooler]
enabled = false

# Pre-production convention: there is ONE schema migration, edited in place.
# A schema change means `supabase db reset` — drop, re-apply, re-seed — never a
# new incremental migration file. See docs/DATABASE_SCHEMA.md section 12.
# These seeds run in filename order after the migration, so 00_ (dev accounts
# + company profile) lands before 10_ (the ~40-client dataset).
[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local email testing (Auth confirmation / recovery mails land here, not a real inbox).
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"
# The invoice-pdfs bucket + its RLS are created by the schema migration
# (INSERT INTO storage.buckets ... ON CONFLICT DO NOTHING), so it is not
# declared here — a [storage.buckets.*] block would make `db reset` prompt
# to overwrite the migration-created bucket every run.

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Production model is "admin creates accounts" — Kong blocks /auth/v1/signup
# on the deployed stack (see infrastructure DEPLOYMENT notes). Local dev keeps
# signup on so test users can be created with `supabase` / curl.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
# Mirrors GOTRUE_MAILER_AUTOCONFIRM=true on the self-hosted stack.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false

[auth.mfa]
# Phone MFA is native in modern GoTrue (the old repo's auth-schema migration
# for it was dropped); toggled by [auth.mfa.phone] below, not by any policy.
max_enrolled_factors = 10

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = true
# "oneshot" = reload on every request (dev). "per_worker" for load testing.
policy = "oneshot"
inspector_port = 8083

# All four functions authenticate the caller (JWT + role checks inside each
# handler). Keep JWT verification on. `set-jmap-secret` additionally requires
# profiles.role = 'admin'.
[functions.generate-pdf]
verify_jwt = true

[functions.set-jmap-secret]
verify_jwt = true

[functions.sync-contacts]
verify_jwt = true

[functions.sync-calendar]
verify_jwt = true

[analytics]
enabled = false
