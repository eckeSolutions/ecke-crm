# ecke-crm — self-hosted Supabase stack (Hetzner + Coolify).
# Based on the official Supabase docker-compose template.
#
# `name:` sets the Compose project → `docker compose ls` shows "ecke-crm",
# and every container is named ecke-crm-<service> (not the ambiguous
# "supabase-*" the old repo used — several other stacks on this machine also
# ship supabase/* images).
name: ecke-crm

services:
  db:
    container_name: ecke-crm-db
    # Bumped 15.1.1.78 -> 17.6.1.168 (6 Sep 2026): far-behind image set, decided
    # in favor of the current major. supabase/config.toml's major_version was
    # bumped to match -- keep the two in lockstep on any future bump.
    image: supabase/postgres:17.6.1.168
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      # Consumed by db-init/jwt.sql -- reused from GoTrue's own var rather
      # than adding a second "how long do JWTs live" knob.
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${GOTRUE_JWT_EXP}
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
      # Verified live 2026-09-05: without these, the image's baked-in role
      # *creation* runs, but nothing ever ALTERs supabase_auth_admin /
      # supabase_storage_admin / authenticator / pgbouncer to
      # POSTGRES_PASSWORD -- auth and storage crash-loop on "password
      # authentication failed" the moment they connect over the docker
      # network (127.0.0.1 uses `trust` in pg_hba.conf and masks this on a
      # same-container psql test; every other source CIDR requires
      # scram-sha-256, where it actually surfaces). Realtime's
      # "invalid_schema_name" crash (already noted below as optional) is the
      # same root cause: no _supabase database / _realtime schema without
      # _supabase.sql + realtime.sql. Mount order doesn't matter -- Postgres
      # runs every /docker-entrypoint-initdb.d/**/*.sql in filename order
      # (init-scripts/98-*, init-scripts/99-*, then migrations/97-*,
      # migrations/99-*), and only on a first-time (empty) data directory.
      - ./db-init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db-init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./db-init/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./db-init/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./db-init/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./db-init/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:ro
      - ./db-init/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      # Persists pgsodium's root key across restarts -- supabase_vault
      # (set-jmap-secret's vault.create_secret/update_secret) is built on
      # pgsodium; without this the key regenerates per-restart and every
      # previously stored secret stops decrypting.
      - db-config:/etc/postgresql-custom
    # Needed for `supabase db push --db-url postgresql://...@localhost:5432/...`
    # (see README.md's self-hosted bring-up section) -- without this the host
    # has no route to the DB at all, only containers on ecke-crm-network do.
    ports:
      - "5432:5432"
    networks:
      - ecke-crm-network

  auth:
    container_name: ecke-crm-auth
    image: supabase/gotrue:v2.196.0
    restart: always
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      # kong.yml routes to auth:9999 — GoTrue defaults to 8081 if this isn't
      # set, which leaves every /auth/v1/* request 502ing.
      GOTRUE_API_PORT: 9999
      # supabase_auth_admin (not the postgres superuser) — the base image
      # pre-configures this role's search_path to "auth", which is what
      # GoTrue's runtime queries rely on (they use unqualified table names
      # like `identities`, not `auth.identities`). Connecting as `postgres`
      # instead left every request 500ing with "relation does not exist"
      # even though the tables existed and migrations had run successfully.
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      # Without this, GoTrue stamps an empty "role" claim into every issued
      # JWT, and PostgREST rejects every REST request signed with it
      # ("role \"\" does not exist") — including the app's post-login
      # profile fetch, which is why sign-in appeared to fail. DEPRECATED as
      # of v2.196.0 (logs a notice, no longer applied) but harmless to leave;
      # GOTRUE_JWT_AUD below is its replacement.
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # NEW, required as of the v2.151.0 -> v2.196.0 bump (6 Sep 2026): with
      # this unset, GoTrue's password-grant lookup runs
      # "... WHERE ... aud = ''" (confirmed via GOTRUE_LOG_LEVEL=debug) against
      # rows whose aud is 'authenticated', so the query matches zero rows and
      # every login 400s "Invalid login credentials" — indistinguishable from
      # a bad password. GOTRUE_JWT_DEFAULT_GROUP_NAME above no longer sets
      # this; it needs stating explicitly now.
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_URL: ${GOTRUE_EXTERNAL_URL}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
    networks:
      - ecke-crm-network
    depends_on:
      - db

  rest:
    container_name: ecke-crm-rest
    image: postgrest/postgrest:v16.2
    restart: always
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      # Was hardcoded here (ignoring .env's PGRST_DB_SCHEMAS entirely) and
      # missing `vault` -- set-jmap-secret's vault RPC calls and
      # resolveJmapCredentials()'s vault read both 500 with "Invalid schema:
      # vault" without it (verified live against the CLI's local stack,
      # 2026-09-05; same PostgREST behavior applies here).
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks:
      - ecke-crm-network
    depends_on:
      - db

  realtime:
    container_name: ecke-crm-realtime
    image: supabase/realtime:v2.134.6
    restart: always
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      # Was `postgres` — same class of fix as storage's DATABASE_URL above:
      # the pg17 image's `postgres` role has no grant on the `_realtime`
      # schema Realtime migrates into, so it 500s on "permission denied for
      # schema _realtime" (verified live, 6 Sep 2026). supabase_admin is the
      # actual superuser role on this image (see db-init/roles.sql's ALTER
      # statements) and is what upstream's own compose uses here.
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      # Newer Realtime (v2.134.6, was v2.30.23) added its own metrics endpoint
      # auth and hard-requires this at boot — without it the release config
      # fails to evaluate at all (System.EnvError, crash-loops before it even
      # tries the DB). Verified live, 6 Sep 2026. Upstream reuses JWT_SECRET.
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    networks:
      - ecke-crm-network
    depends_on:
      - db

  storage:
    container_name: ecke-crm-storage
    image: supabase/storage-api:v1.73.0
    restart: always
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # Was `postgres` — worked against 15.1.1.78/v1.11.13, but the pg17 image's
      # stricter default grants leave the plain `postgres` role without USAGE on
      # the storage schema, so storage-api's own migration run 500s with
      # "permission denied for schema storage" (verified live, 6 Sep 2026).
      # supabase_storage_admin owns that schema; matches how the `auth` service
      # already connects as supabase_auth_admin, and upstream's own compose.
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - ./volumes/storage:/var/lib/storage
    networks:
      - ecke-crm-network
    depends_on:
      - db
      - rest

  meta:
    container_name: ecke-crm-meta
    image: supabase/postgres-meta:v0.99.0
    restart: always
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - ecke-crm-network
    depends_on:
      - db

  # Deno runtime for supabase/functions/*. The old stack had no functions
  # runtime and no Kong /functions/v1 route, which is why generate-pdf /
  # set-jmap-secret / sync-contacts / sync-calendar were never invokable
  # end-to-end. This runs ONE entrypoint — supabase/functions/main/index.ts —
  # which spawns a worker per request keyed on the first path segment.
  # Live-tested through Kong with a real JWT 2026-09-05; pin the edge-runtime
  # image + main dispatcher API together when bumping either.
  edge-functions:
    container_name: ecke-crm-edge-functions
    image: supabase/edge-runtime:v1.76.2
    restart: always
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      # Optional local/test override for the JMAP sync functions. Unset => they
      # fall back to company_settings.jmap_* + Supabase Vault, as before.
      # (see supabase/functions/.env.example)
      JMAP_ENDPOINT: ${JMAP_ENDPOINT:-}
      JMAP_USERNAME: ${JMAP_USERNAME:-}
      JMAP_API_KEY: ${JMAP_API_KEY:-}
    volumes:
      - ../../supabase/functions:/home/deno/functions:ro
    command:
      - start
      - --main-service
      - /home/deno/functions/main
    networks:
      - ecke-crm-network
    depends_on:
      - db

  studio:
    container_name: ecke-crm-studio
    image: supabase/studio:2026.09.04-sha-5a67366
    restart: always
    environment:
      # Server-side calls (studio's own Next.js API routes) go through Kong
      # on the docker network; SUPABASE_PUBLIC_URL is what the browser uses.
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      # Required for the Table Editor / schema views — without this Studio
      # can't reach postgres-meta and crash-loops on requests that need it.
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: "ecke.Solutions"
      DEFAULT_PROJECT_NAME: "ecke-crm"
    # No host port: only reachable through kong, behind the basic-auth gate in
    # kong.yml. Publishing 3000 directly here is what bypassed that gate before.
    networks:
      - ecke-crm-network
    depends_on:
      - meta
      - rest

  kong:
    container_name: ecke-crm-kong
    image: kong:3.9.3
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
    volumes:
      # Copy ../kong.yml.example to ./volumes/api/kong.yml (gitignored) and fill
      # in the dashboard credentials — Kong's declarative loader doesn't expand
      # env vars and this image has no writable $HOME for a templated copy.
      - ./volumes/api/kong.yml:/var/lib/kong/kong.yml
    ports:
      - "8000:8000"
    networks:
      - ecke-crm-network
    depends_on:
      - auth
      - rest
      - realtime
      - storage
      - meta
      - studio
      - edge-functions

networks:
  ecke-crm-network:
    driver: bridge

volumes:
  db-config:
